<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#0e172a" />
    </linearGradient>
    <linearGradient id="albGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.08" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .card-bg { fill: url(#bgGrad); stroke: rgba(255,255,255,0.12); stroke-width: 1; rx: 14px; }
    .title-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 11px; fill: #94a3b8; font-weight: 600; }
    .node-title { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; }
    .node-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #94a3b8; }
    .pipe-active { stroke: #10b981; stroke-width: 2.5; stroke-dasharray: 6 4; fill: none; animation: dashMove 1.5s linear infinite; }
    .pipe-canary { stroke: #3b82f6; stroke-width: 2; stroke-dasharray: 5 4; fill: none; opacity: 0.7; animation: dashMove 2.5s linear infinite; }
    @keyframes dashMove { from { stroke-dashoffset: 20; } to { stroke-dashoffset: 0; } }
    .pulse-dot { animation: blink 1.2s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>

  <!-- Background Card -->
  <rect x="2" y="2" width="596" height="236" class="card-bg" />
  
  <!-- Grid background lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="20" y1="60" x2="580" y2="60" />
    <line x1="20" y1="120" x2="580" y2="120" />
    <line x1="20" y1="180" x2="580" y2="180" />
    <line x1="150" y1="20" x2="150" y2="220" />
    <line x1="300" y1="20" x2="300" y2="220" />
    <line x1="450" y1="20" x2="450" y2="220" />
  </g>

  <!-- Top Status Badge -->
  <rect x="20" y="16" width="310" height="24" rx="12" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" />
  <circle cx="34" cy="28" r="4" fill="#10b981" class="pulse-dot" />
  <text x="46" y="32" class="title-text" fill="#10b981">LIVE ROUTING • 90% GREEN (v2) / 10% CANARY</text>

  <!-- 3D ALB Router Node -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="130" height="90" rx="10" fill="url(#albGrad)" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="28" cy="30" r="14" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" />
    <text x="24" y="34" font-family="sans-serif" font-size="12" fill="#f59e0b">🔀</text>
    <text x="50" y="34" class="node-title">AWS ALB</text>
    <text x="20" y="60" class="node-sub" fill="#f59e0b">Listener Rules</text>
    <text x="20" y="74" class="node-sub">Weighted Cutover</text>
  </g>

  <!-- SVG Traffic Pipes with Continuous Moving Packets -->
  <!-- Pipe 1: ALB to Green Target Group -->
  <path d="M 170 110 C 230 110, 240 85, 330 85" class="pipe-active" />
  <!-- Streaming Packets along Green Pipe -->
  <circle r="4" fill="#10b981" filter="url(#glowGreen)">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 170 110 C 230 110, 240 85, 330 85" />
  </circle>
  <circle r="4" fill="#34d399" filter="url(#glowGreen)">
    <animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite" path="M 170 110 C 230 110, 240 85, 330 85" />
  </circle>

  <!-- Pipe 2: ALB to Blue Target Group -->
  <path d="M 170 140 C 230 140, 240 170, 330 170" class="pipe-canary" />
  <!-- Streaming Packet along Blue Pipe -->
  <circle r="3.5" fill="#3b82f6" filter="url(#glowBlue)">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M 170 140 C 230 140, 240 170, 330 170" />
  </circle>

  <!-- Target Group Green (v2) - Active -->
  <g transform="translate(330, 55)">
    <rect x="0" y="0" width="230" height="65" rx="8" fill="url(#greenGrad)" stroke="#10b981" stroke-width="1.5" />
    <circle cx="16" cy="20" r="4" fill="#10b981" class="pulse-dot" />
    <text x="26" y="24" class="node-title" fill="#34d399">TARGET GREEN (v2) • 90%</text>
    <rect x="16" y="34" width="90" height="22" rx="4" fill="#141f38" stroke="rgba(255,255,255,0.1)" />
    <text x="24" y="49" class="node-sub" fill="#f8fafc">🖥️ EC2-App-1</text>
    <rect x="114" y="34" width="90" height="22" rx="4" fill="#141f38" stroke="rgba(255,255,255,0.1)" />
    <text x="122" y="49" class="node-sub" fill="#f8fafc">🖥️ EC2-App-2</text>
  </g>

  <!-- Target Group Blue (v1) - Standby / Canary -->
  <g transform="translate(330, 140)">
    <rect x="0" y="0" width="230" height="60" rx="8" fill="url(#blueGrad)" stroke="#3b82f6" stroke-width="1" />
    <circle cx="16" cy="20" r="3.5" fill="#3b82f6" />
    <text x="26" y="24" class="node-title" fill="#60a5fa">TARGET BLUE (v1) • 10% CANARY</text>
    <rect x="16" y="32" width="100" height="20" rx="4" fill="#141f38" stroke="rgba(255,255,255,0.1)" />
    <text x="24" y="46" class="node-sub" fill="#94a3b8">🖥️ EC2-Standby</text>
  </g>
</svg>