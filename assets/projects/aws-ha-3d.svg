<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="240">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e1e" />
      <stop offset="100%" stop-color="#121832" />
    </linearGradient>
    <linearGradient id="azGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="azGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .card-bg { fill: url(#bgGrad3); stroke: rgba(255,255,255,0.12); stroke-width: 1; rx: 14px; }
    .title-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 11px; font-weight: 600; }
    .node-title { font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 700; fill: #f8fafc; }
    .node-sub { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; fill: #94a3b8; }
    .pulse-dot { animation: blink 1.2s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .beam-stream { stroke-dasharray: 4 3; animation: dashMove 1.6s linear infinite; }
    @keyframes dashMove { from { stroke-dashoffset: 14; } to { stroke-dashoffset: 0; } }
  </style>

  <rect x="2" y="2" width="596" height="236" class="card-bg" />

  <!-- Top Ingress Bar: ALB Multi-AZ -->
  <g transform="translate(160, 14)">
    <rect x="0" y="0" width="280" height="28" rx="14" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1.2" />
    <circle cx="16" cy="14" r="4" fill="#f59e0b" class="pulse-dot" />
    <text x="28" y="18" class="title-text" fill="#f59e0b">🛡️ Multi-AZ Application Load Balancer</text>
  </g>

  <!-- Splitting Traffic Beams to AZ-A and AZ-B -->
  <path d="M 230 42 C 200 55, 150 55, 150 70" stroke="#3b82f6" stroke-width="2" fill="none" class="beam-stream" />
  <circle r="3.5" fill="#3b82f6">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 230 42 C 200 55, 150 55, 150 70" />
  </circle>

  <path d="M 370 42 C 400 55, 450 55, 450 70" stroke="#8b5cf6" stroke-width="2" fill="none" class="beam-stream" />
  <circle r="3.5" fill="#8b5cf6" filter="url(#glowPurple)">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 370 42 C 400 55, 450 55, 450 70" />
  </circle>

  <!-- AZ 1A -->
  <g transform="translate(30, 70)">
    <rect x="0" y="0" width="240" height="110" rx="8" fill="url(#azGradA)" stroke="#3b82f6" stroke-width="1.5" />
    <text x="14" y="22" class="node-title" fill="#60a5fa">AVAILABILITY ZONE A (us-east-1a)</text>
    
    <!-- Public Subnet -->
    <rect x="14" y="32" width="212" height="30" rx="5" fill="#141f38" stroke="rgba(59, 130, 246, 0.3)" />
    <text x="24" y="51" class="node-sub">🌐 Public Subnet: NAT-GW-A</text>
    
    <!-- Private Subnet -->
    <rect x="14" y="68" width="212" height="30" rx="5" fill="#141f38" stroke="rgba(16, 185, 129, 0.3)" />
    <text x="24" y="87" class="node-sub" fill="#34d399">🔒 Private Subnet: ASG EC2 Node A</text>
  </g>

  <!-- Center Cross-Zone Sync Arrows -->
  <g transform="translate(285, 105)">
    <circle cx="15" cy="20" r="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" />
    <text x="9" y="24" font-size="12" fill="#38bdf8">⇄</text>
    <text x="-14" y="44" class="node-sub" font-size="8">Cross-AZ</text>
  </g>

  <!-- AZ 1B -->
  <g transform="translate(330, 70)">
    <rect x="0" y="0" width="240" height="110" rx="8" fill="url(#azGradB)" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="14" y="22" class="node-title" fill="#a78bfa">AVAILABILITY ZONE B (us-east-1b)</text>
    
    <!-- Public Subnet -->
    <rect x="14" y="32" width="212" height="30" rx="5" fill="#141f38" stroke="rgba(139, 92, 246, 0.3)" />
    <text x="24" y="51" class="node-sub">🌐 Public Subnet: NAT-GW-B</text>
    
    <!-- Private Subnet -->
    <rect x="14" y="68" width="212" height="30" rx="5" fill="#141f38" stroke="rgba(16, 185, 129, 0.3)" />
    <text x="24" y="87" class="node-sub" fill="#34d399">🔒 Private Subnet: ASG EC2 Node B</text>
  </g>

  <!-- Bottom Strip: S3 Gateway Endpoint -->
  <g transform="translate(30, 192)">
    <rect x="0" y="0" width="540" height="28" rx="6" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.35)" />
    <circle cx="20" cy="14" r="4" fill="#10b981" class="pulse-dot" />
    <text x="32" y="18" class="title-text" fill="#34d399">⚡ S3 Gateway VPC Endpoint • Private Network Path to S3 Bucket (No Internet Hops)</text>
  </g>
</svg>