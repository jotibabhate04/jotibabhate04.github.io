<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="240">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d18" />
      <stop offset="100%" stop-color="#0f192d" />
    </linearGradient>
    <linearGradient id="webGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="appGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.08" />
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .card-bg { fill: url(#bgGrad2); stroke: rgba(255,255,255,0.12); stroke-width: 1; rx: 14px; }
    .title-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 11px; font-weight: 600; }
    .node-title { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700; fill: #f8fafc; }
    .node-sub { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; fill: #94a3b8; }
    .pipe-line { stroke: rgba(255,255,255,0.2); stroke-width: 2; stroke-dasharray: 4 3; fill: none; }
    .pulse-dot { animation: blink 1.4s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>

  <rect x="2" y="2" width="596" height="236" class="card-bg" />

  <!-- Top Banner -->
  <rect x="20" y="16" width="330" height="24" rx="12" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.3)" />
  <circle cx="34" cy="28" r="4" fill="#06b6d4" class="pulse-dot" />
  <text x="46" y="32" class="title-text" fill="#06b6d4">CONTAINERIZED 3-TIER • BRIDGE NETWORK ISOLATED</text>

  <!-- Tier 1: Web (Nginx) -->
  <g transform="translate(30, 65)">
    <rect x="0" y="0" width="145" height="110" rx="10" fill="url(#webGrad)" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="20" cy="22" r="4" fill="#06b6d4" class="pulse-dot" />
    <text x="32" y="26" class="node-title" fill="#06b6d4">1. WEB TIER</text>
    <text x="20" y="50" class="node-title">Nginx Proxy</text>
    <text x="20" y="68" class="node-sub">Port 80 / 443 SSL</text>
    <text x="20" y="84" class="node-sub">Static Asset Cache</text>
    <text x="20" y="98" class="node-sub" fill="#06b6d4">Container #1</text>
  </g>

  <!-- Pipe 1: Nginx -> Django -->
  <line x1="175" y1="120" x2="225" y2="120" class="pipe-line" />
  <circle r="4" fill="#06b6d4" filter="url(#glowCyan)">
    <animateMotion dur="1.5s" repeatCount="indefinite" path="M 175 120 L 225 120" />
  </circle>
  <text x="180" y="112" class="title-text" fill="#94a3b8" font-size="8.5">proxy_pass</text>

  <!-- Tier 2: App (Django) -->
  <g transform="translate(225, 65)">
    <rect x="0" y="0" width="145" height="110" rx="10" fill="url(#appGrad)" stroke="#10b981" stroke-width="1.5" />
    <circle cx="20" cy="22" r="4" fill="#10b981" class="pulse-dot" />
    <text x="32" y="26" class="node-title" fill="#10b981">2. APP TIER</text>
    <text x="20" y="50" class="node-title">Django Core</text>
    <text x="20" y="68" class="node-sub">Gunicorn WSGI :8000</text>
    <text x="20" y="84" class="node-sub">Python 3 MVC / API</text>
    <text x="20" y="98" class="node-sub" fill="#10b981">Container #2</text>
  </g>

  <!-- Pipe 2: Django -> MySQL -->
  <line x1="370" y1="120" x2="420" y2="120" class="pipe-line" />
  <circle r="4" fill="#f59e0b">
    <animateMotion dur="1.7s" repeatCount="indefinite" path="M 370 120 L 420 120" />
  </circle>
  <text x="375" y="112" class="title-text" fill="#94a3b8" font-size="8.5">TCP :3306</text>

  <!-- Tier 3: Database (MySQL) -->
  <g transform="translate(420, 65)">
    <rect x="0" y="0" width="150" height="110" rx="10" fill="url(#dbGrad)" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="20" cy="22" r="4" fill="#f59e0b" class="pulse-dot" />
    <text x="32" y="26" class="node-title" fill="#f59e0b">3. DB TIER</text>
    <text x="20" y="50" class="node-title">MySQL 8.0</text>
    <text x="20" y="68" class="node-sub">Named Volume Mount</text>
    <text x="20" y="84" class="node-sub">Data Persistence</text>
    <text x="20" y="98" class="node-sub" fill="#f59e0b">Container #3</text>
  </g>

  <!-- Bridge Network Footer -->
  <g transform="translate(30, 190)">
    <rect x="0" y="0" width="540" height="26" rx="6" fill="rgba(59, 130, 246, 0.08)" stroke="rgba(59, 130, 246, 0.3)" stroke-dasharray="4 3" />
    <text x="140" y="17" class="title-text" fill="#60a5fa">🔗 User-Defined Bridge Network (app-network: 172.28.0.0/16)</text>
  </g>
</svg>